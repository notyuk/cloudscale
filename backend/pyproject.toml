[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudscale"
version = "1.0.0"
description = "Deterministic discrete-event simulator for evaluating autoscaling strategies"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "numpy>=2.1,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "hypothesis>=6.115,<7",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]
experiments = [
    "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "C4", "PT"]
ignore = [
    "PLR0913",  # simulation configs legitimately carry many parameters
    "PLR2004",  # magic values are fine in tests and documented thresholds
    "PLR0911",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
