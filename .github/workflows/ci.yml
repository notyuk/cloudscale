name: CI

on:
  push:
    branches: [main, "develop/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest --cov=app --cov-report=term
      - name: Lint experiments
        run: ruff check --config pyproject.toml ../experiments && ruff format --check --config pyproject.toml ../experiments
      - name: Benchmarks reproduce the committed digest
        working-directory: .
        run: python experiments/run.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: Smoke test through the frontend proxy
        run: |
          curl -fsS localhost:3000/api/health
          curl -fsS -X POST localhost:3000/api/simulations/compare \
            -H 'content-type: application/json' \
            -d '{"scenario": {"duration_s": 300}}' > /dev/null
      - if: always()
        run: docker compose down
