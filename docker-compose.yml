services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CLOUDSCALE_CORS_ORIGINS: http://localhost:3000
      CLOUDSCALE_MAX_CONCURRENT: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      CLOUDSCALE_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
